  text: 玉音法事卷下養三
  hash: sha256:0db480c559e1382ebe1902eb2ab245838eef7dd4bc1195fb619a02e021cd98d4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0312_HFL_003-001a, image: hfl/0333/0333-074.png}
body:
  text: 啓經文道衆平坐舉起敬讃次三皈依次敷坐讃誦念如法表白啓經雲篆太虛浩劫之初乍遐乍邇或沉或浮五方徘徊一丈之餘天真皇人按筆乃書以演洞章次書靈符元始下降真文誕敷昭昭其有冥冥其無沉痾能目痊塵勞溺可扶幽明將存殁由是升仙都發如是上願者以今升入經座謹奉為某增延壽算康泰身躬凡歷時中吉祥如意伏願東華注算南極延生福與海以同深壽比山而永固為此因緣念福生無量天尊延壽益算天尊長生保命天尊無量不可思議功德開經法事看誦寶經經畢次舉促吟步虛表白嘆經詳夫三洞寶經乃萬天聖範結飛玄之妙氣成大梵之龍章義貫浮生文垂永劫故天地得之而分判日月因之以運行鬼神敬之則變通人能奉之乃開泰是以詠之者形陟絳霄聞之者身騰碧落莫不人天仰賴生化依憑為群品之津梁作衆真之户牖不可得而言之者其為大乘經藴乎向來奉為今辰齋主某諷誦太上真經其經也莫不開函演奧響徹三天執卷吟哦聲聞九地當願侍香金童結香字於天中典經玉郎進經文於簡上即使愆消昔劫福降今辰存亡希開泰之恩動植感生成之德乘兹善利遍悉莊嚴三塗罷楚毒之勞九夜絶辛酸之苦洎手悠悠庶品蠢蠢含生俱登六度之舟並上三清之岸法衆虔誠聞經讃詠次舉聞經就手收經次解坐讃次舉向來向來誦經功德上祈真聖保佑平安同賴善功證無上道一切信禮次回向天回雲漢結真氣以成文地發琅函顯靈章而出世功參造化利益人天向來諷誦太上真經稱念天尊聖號聲讃法事功德無限勝因奉為某入意伏願云云黃籙啓經文道衆平坐舉起敬讃次三皈依次敷坐讃誦念如法表白啓經劫仭寶臺香雲素蓋妙哉元始洞觀無礙諸天大聖一時同會靈寶開圖鄷都罷對金籙白簡九真妙戒是謂津粱超度三界以今升入經座轉誦仙經當發如是願今辰奉為黃籙齋主某資薦亡過某神魂超升仙界伏願朱陵度命金闕化身逍遙快樂以無為隨願往生而自在請法衆等異口同音為此因緣念太一救苦天尊九幽拔罪天尊法橋大度天尊超凌三界天尊逍遙快樂天尊不可思議功德開經法事虛皇號轉誦寶經俟經畢舉促吟步虛表白嘆經靈寶嘆經伏以元始祖劫化生諸天演碧落之空歌映紫虛之鬱秀開明三景用普植於神靈敷落五篇以保制於劫運或坐獅子之上或入寶珠之中萬聖臨軒衆真侍座是諸天之隱韻非世上之常辭自然靈章故謂玄奧一遍而同時稱善十過而枯骨更生其福難勝度人無量以今亡過某運應滅度身經太隂諒其仙品之未充孰謂神魂之暫滅有五苦八難之報對無千和萬合之成真當憑行香而誦經尚冀回骸而起死伏冀元始符命魔王歌章上聞諸天普告三界致飛度於五户使混合於百神落滅惡根疾除罪簿濟度垂死絶而得生時刻升遷魂神澄正徑執符而把籙得保命以生根十轉回靈證死魂而受鍊皆得度世應仙化以成人旁資億劫種親下及幽魂苦爽皆上升於仙品免長役於鬼官永度三塗五苦八難超凌三界逍遙上清次願今辰齋官某與家眷等遇值經法得為貴人身有光明魔無干犯萬神朝禮名書上清法衆虔誠聞經讃詠諷度人經回向元始靈書諸天隱韻齊聲諷誦一言消萬劫之愆異口同音十過度九幽之苦向來諷誦無量度人上品妙經稱念天尊聖號聲讃法事功德無限勝因奉為黃籙齋主某入意伏願六根清淨獲登黎土以聞經一性圓明同入寶珠而證果諷并看度人經回向靈書中篇可救三塗之苦本章上品能遷九夜之魂向來諷誦無量度人上品妙經稱念天尊聖號稱讃法事功德無限勝因奉為齋主某入意伏願上升朱宫憑百魔之隱韻貴生仙道同七祖以超遷伏願承元始之真符死魂受鍊聽大梵之隱語仙化成人伏願衆真鑒度列聖垂慈死魂受鍊以更生異骨成親而超度伏願已度者度承鍊度而仙化成人未生者生獲更生而超離惡趣舉懴二十方天尊號東方靈寶天尊東方無極太上靈寶天尊南方靈寶天尊南方無極太上靈寶天尊西方靈寶天尊西方無極太上靈寶天尊北方靈寶天尊北方無極太上靈寶天尊東北方靈寶天尊東北方無極太上靈寶天尊東南方靈寶天尊東南方無極太上靈寶天尊西南方靈寶天尊西南方無極太上靈寶天尊西北方靈寶天尊西北方無極太上靈寶天尊上方靈寶天尊上方無極太上靈寶天尊下方靈寶天尊下方無極太上靈寶天尊五星天尊號懴五星真光普照天尊日宫至真大聖日中皇君慧光朗照天尊月宮至真大聖月中皇君流光輝照天尊南辰北斗璇璣衆矅一切真宰洞淵三昧天尊水府扶桑丹林大帝十方經寶天尊至真無上三十六部尊經五嶽天尊號懴五嶽東華上相天尊東嶽泰山青帝真君南宮冶鍊天尊南嶽衡山赤帝真君西靈寶德天尊西嶽華山白帝真君北元總校天尊北嶽恆山黑帝真君中黃帝二天尊中嶽嵩山黃帝真君日夜禮方次序日舉唱禮始於東方次如下式東方南方西方北方東北東南西南西北上方下方夜舉唱禮始於北方次如下式北方東北東方東南南方西南西方西北上方下方清醮都唱臣衆等志心歸命東青西素南丹北冥四維上下十方無極大道太上靈寶天尊梵氣天君十鄉神仙諸靈官禮足虔誠懴悔黃籙都唱臣衆等志心歸命東青西素南丹北冥四維上下十方無極大道太上靈寶天尊洞隂朔單鬱絶之境虛無北界太隂黑帝五氣靈君酆都大帝地府十王真君冥關主宰一切神仙諸靈官禮足虔誠懴悔舉唱十方東方無極太上靈寶天尊九氣天君東鄉神仙諸靈官九禮南方無極太上靈寶天尊三氣天君南鄉神仙諸靈官三禮西方無極太上靈寶天尊七氣天君西鄉神仙諸靈官七禮北方無極太上靈寶天尊五氣天君北鄉神