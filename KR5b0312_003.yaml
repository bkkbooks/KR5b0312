德經仙鶴翔集而作一氣化之元邈在兩儀先寶埒馳金馬真香噴玉蓮飛空按龍轡梵響導芝軿綿永長春劫翺翔無色天初真難曉諭以此戒中仙髙真明道德垂世五千言解釋慚涼薄殫誠測妙元霓旌嚴教典羽唱徹雲軿瑞鶴儀空際祥風拂暑煩穹窿兹響應寶祚億斯年玉京步虛詞十首稽首禮太上燒香歸虛無流明隨我回法輸亦三周玄元四大興靈慶及王侯七祖生天堂煌煌耀景敷嘯歌冠太漠天樂適我娛齊馨無上德下仙不與儔妙想朗玄覺詵詵乘虛遊吟至靈慶及王侯方隱侯字旋行躡雲綱乘虛步玄紀吟詠帝一尊百關自調理俯命八海童仰擕髙仙子諸天散香華蕭然靈風起宿願定命根故致標髙擬觀樂太上前萬劫猶未始嵯峨玄都山十方宗皇一岧岧天寶臺光明曜流日煒燁玉林華蒨璨耀朱實常念餐元精鍊液固形質金光散紫微窈窕大乘逸上一首韻腳皆真聲無隱字故朝奏時通作一首全句吟詠俯仰存太上華景秀丹田左顧提鬱儀右盻擕結璘六度冠梵行道德隨日新宿命積福應聞經若至親天挺超世才樂誦希微篇沖虛太和氣吐納流霞精胎息靜百關寥寥究三便泥丸洞明景遂成金華仙魔王敬受事故能朝諸天皆從齋戒起纍功結宿緣飛行凌太虛提擕髙上人控轡適十方旋憩玄景何仰觀劫仭臺俯盻紫雲羅逍遙太上京相與坐蓮華積學為真人恬然榮衛和永享無期壽萬椿奚足多大道師玄寂升仙有無英公子度靈符太一捧洞章舍利耀金姿龍駕倐來迎天尊盻雲輿飄飄乘虛翔香花若飛雪氛靄茂玄梁頭腦禮金闕擕首遨玉京騫樹圓景園煥爛七寶林天獸三百名獅子巨萬尋飛龍躑躅吟神鳳應節鳴靈風扇竒華清香散人襟自無髙仙才焉能耽此心嚴我九龍駕乘虛以逍遙八天如指掌六合何足遼衆真誦洞玄太上唱清謡香華隨風散玉音戒紫霄五苦一時迸八難順經寥妙哉靈寶囿興此大法橋天真帝一宫藹藹冠耀靈流煥法輪綱旋空入無形虛皇撫雲璈衆真誦洞經髙仙凛乎讃彌劫保利貞至真無所待時或轡飛龍長齋會玄都鳴玉叩瓊鍾十華諸仙集紫煙結成宫寶蓋羅太上真人把芙蓉散花陳我願握莭徵魔王法鼓會群仙靈唱靡不同無可無不可思與希微通右玉京步虛十首按太上玉京山步虛經云太極左仙翁葛玄於天台山傳授弟子鄭思遠思遠復傳仙翁從孫葛洪號抱朴子者是也鄭君説仙翁去世時告思遠曰所受上清大洞道經付吾家門子弟世世録傳至人勿閉天道信知琅函祕典貴在流通兼經首所載諸大聖天尊帝王髙仙真人各各持齋奉法宗太上虛皇號燒香散花旋繞七寶玄臺三周匝誦披空洞大歌章太上稱善則歌詠步虛其功德深妙不可得而殫説也謹按藏經中齋法云三日九朝在每一朝之內各歌詠十首今其周足每朝至旋繞之時壇衆未行先舉稽首禮太上吟詠至末句同唱善聲各一拜次舉旋行躡雲罡詠和次壇衆丁罡步徐行至末句同唱善聲各一拜次後每一首畢同唱善聲皆各一拜又謂如尋常一日三朝可在三朝之內共周足其十首第一匝舉稽首禮太上吟詠至末句同唱善聲各一拜第二匝舉旋行躡雲綱連過嵯峨玄都山通作一首吟詠至末句同唱善聲各一拜緣此二首悉皆仄聲所以共作一次吟詠也第三匝舉俯仰存太上吟詠至末句同唱善聲各一拜正合早朝也餘有六首分在午朝晚朝之內每一匝吟詠一首如此則三朝之內十首亦周足矣乃合朝奏玉京山全詠之式也如吟詠步虛若闕一首恐在登壇朝奏祈禱之時誠心不專難以鑒格上聖髙真大凡醮筵登壇行道惟在旋繞朝奏玉京山之時存想金闕瓊宫晬容聖質尓然後可以祈恩請福祓死度生今觀仙翁所傳乃是鄭君聲説蓋欲流傳後人使之依式而行既覽經典所載豈容緘藏敬刻諸梓與衆共之切在精虔勿生疑慮庶幾得獲聖佑同沾福利空洞靈章曜明髙映宗飄通玄元始開圖敷落五篇赤書寶籙二黃雲四纏八威備衛靈獸侍真華光飾發反香拂塵綺合長阜旋回十天髙唱空洞飛步入玄枯魂升陽灰骸還人神王度命乘虛駕煙禮誦洞章與劫齊年右曜明宗飄天帝君道經空洞靈章也三十二天各有一篇或四言或五言見洞元部靈寶空洞靈章奉戒頌道為無心宗一切作福田立功無定王本願各由人虛己應衆生空心莫不均大聖崇至教人亦由雨降天髙陵靡不周常卑故成淵海為百川王是能舍龍鱗萬劫保智用豈但在厥年奉戒不暫虧世世善結緣精思念大乘會當體道真三啓三首樂法以為妻愛經如珠玉持戒制六情念道遣所欲淡泊正氣停蕭然神靜默天魔並敬護世世受大福鬱鬱家國盛濟濟經道興天人同其願縹眇入大乘因心立福田靡靡法輪升七祖生天堂我身白日騰大道洞玄虛有念無不契鍊質入仙真遂成金剛體超度三界難地獄五苦解悉歸太上經靜念稽首禮啓堂頌學道當勤苦斂信運丹誠燒香歸太上真氣雜煙馨惟希開大有七祖離幽冥敷齋頌道以齋為先勤行登金闕故設大法橋溥度諸人物宿世恩德報道心超然發身飛升玄都七祖咸解脫大學仙頌學仙絶華念念念相因積去來亂我神神躁靡不歷滅念停虛間簫簫入空寂請經若飢渴持志如金石保子飛玄路五靈度符籍小學仙頌學仙行為急奉戒制情心虛夷正氣居仙聖自相尋若不信法言胡為棲山林焚詞頌人天多障纍大道實矝憐救度垂科教咸令懴罪緣愆辜遍地府釁給已聞天發露祈真祐冥心感聖賢虔恭禮三寶願得壽長年焚詞歸上界奏名玉帝前山簡祈真登紫嶽告命詣靈山玉女搖梵響金童奏香煙書名通九地列字上三天永享無期壽克成髙上仙水簡天尊留戒律太上演真經奉法須勤志功德貴精神虔心啓三寶焚香告百靈書名投水府功勳達上清天尊留太法廣救度幽冥齋福行當息龍簡告泉庭七祖咸解脫萬福自來並書名投水府功勳達上清土簡齋功巳成就符命告靈壇玉璧書誠悃金龍信驛傳虔心仰中府歸命拱黃圓生死皆快樂會當禮天顔赤明開元圖和陽通上靈玉阜秀瓊宫萬遍道自居自無黃籙簡苦根焉得除旋行誦洞章五雲自相扶整控啓玄極乘運入中天披空獻心寶妙學其身田日宫散和氣寥庭騰願煙土簡難思議降福惠無邊元始流科訓髙真演洞神丹書華晃耀玉字勒精神虔心啓九天修齋達萬靈書名投土府身飛朝玉清智惠頌智惠起本初朗朗超十方給空峙玄霄諸天挹流芳其妙難思議虛感真實通有有竟不有無無無不無智惠常觀身學道之所先眇眇任玄肆自然録我神天尊常擁護魔王為保言晃晃金剛體超超太上前智惠生戒根真道戒為主三寶由是興髙仙所崇授泛此不死舟倐欻濟大有當此説戒時諸天皆稽首沭浴東井頌天河灌東井石景水母精圓光拂靈曜玄映瑩髙明元始披重夜天人逐月生沭浴蘭池上龍負長綆瓶金童灑香水玉女流五星冠帶耀玉精錬度五仙形體香萬神降乘景登髙明清水度魂呪巍巍道德尊功行已周齊降身來接引師寶自相擕慈悲惠法水以用洗迷愚永度三清岸常辭五濁泥天真六通頌天真六通神人造善緣者為彼諸衆生説諸不慚愧天尊祕密語此時聞演説信受各歸依稽首無上尊返生頌鍊度用代謝若旋環椿木不改柯靜心念至真隨運順離羅常能誦玉章玄音徹霄霞永享無終紀豈知年劫多金木頌扶桑啓靈運金木吐青芽妙用流金母和合自然葩神氣凝元宫靈物耀絳霞自得生人道名籍繼仙家朱陵黃華太一三偈南上朱陵府丹天流火庭玉眸鍊形質即返生大聖玉眸鍊質天尊東井黃華沼石景水母精黃華蕩形魂即更生大聖黃華蕩形天尊東極長樂界青華號福庭尋聲救苦魂即往生大聖太乙救苦天尊七言古散花南斗瓓珊北斗移衆星蒨璨月華輝元始傳言齊授籙道君開教盡歸依小有洞中千秋草玉京山上萬年桃九龍闕上集真聖八仙臺畔步虛謡三真玉女持花節一雙童子捧金爐月帔珠穿九彩綬雲衣香透六銖裾五言散花逸轡登紫清元乘邁奔電閬風隔三天俯視猶可見玉闥摽敞朗瓊林鬱蔥蒨自非挺金骨焉得諧夙願真明何森森合景恣遊宴良會忘淹留千齡才一盻三宫發明景朗照同鬱儀紛然馳飈歘上采空清𤯹令我洞金色後天耀瓊姿心協太虛靜寥寥竟何思玄中有至樂淡泊終無為但與正真友飄颻散遨嬉稟化凝正氣鍊形為真仙志心符元宗返本叶自然帝一集終宫流光出丹玄無英與桃君朗詠長生篇百關羅紫煙颷車涉寥廓靡靡八景遷不覺雲路遠斯須遊方天扶桑誕初景羽蓋凌晨霞倐欻造西域嬉遊金母家碧津湛洪源灼爍敷荷花煌煌青琳宫燦燦列玉華真氣溢絳府自然思無邪俯矜區中士天濁良可嗟瓊臺劫為仭孤映大羅表常有三素雲凝光自飛繞羽童泛明霞升降何縹眇鸞鳯吹雅音棲翔絳林標玉虛無晝夜靈景何皎皎一覩太上京方知衆天小灼灼青華林靈風振瓊柯三光無冬春一氣清且和回首邇結璘傾眸親曜羅豁落制六天流鈴威百魔綿綿慶不極誰謂椿齡多髙情無侈靡遇物生華光至樂無簫歌金玉音琅琅或登明真臺宴此羽景堂杳靄結玉雲霏微散靈香天人誠遐曠歡泰不可量爰從太微上肆覲虛皇尊騰我八景輿威遲入天門既登玉晨庭肅肅仰紫軒敢問龍漢末如何闢乾坤怡然輟雲璈告我希夷言幸聞至精理方見造化源二氣播萬有化機無停輪而我操其端乃能出陶鈞寥寥大漠上所遇皆清真澄瑩含元和氣同自相親絳樹結丹實紫霞流碧津以兹保童嬰永用超形神宋真宗製玉清昭應宫散花詞十首散花何處最花多天上髙天有大羅花在此中生本異况將瑞露慶雲和崑丘絶頂有龜臺臺上竒花四序開不是群仙朝玉帝何由得到世間來天上天花旦夕開不同人世待春來天花每有天人折將獻層城日幾回瑶臺光夜露華滋月帔朝真在此時時有仙花空裏降吹來玉宇奉金姿五色華花降洞天仰觀空裏勢翩翩莫言仙境常時有動是人寰億萬年仙花折得自仙宫散在珍臺曉景中玉闕有春春不老璿圖受福福無窮羽客驂鸞在半天下瞻真館意乾乾蓬萊折得花無數散在殊庭黼座前上林花卉先春發幽谷鶯聲尚未知下遣常人攀折得盡將福地奉真期洞中三十六天春仙境由來異世人採得名花何處去將來宫殿奉髙真仙官真侣往還頻互看蓬萊閬苑春每採芳花朝上帝願均福地及生民太極太虛真人歌三塗五苦頌八首三才及萬物倚伏各有齡終始待劫數福盡天地傾往返於五道苦哉更死生展轉三途中去來與福并大賢愼兹戒忍性念割情愚夫不信法罪痛常自嬰吾念世無已今故重告明若欲度斯禍歸命太上經罪福不由它諒自發爾身大賢故閉口欲絶諸惡緣滅念歸兼忘倚伏待長泯弘道以安世終當見其真媱嫉為禍首滅身之至患含養知此輩恐必致夭殘知惡而不革豈是道所安懷毒日齋直令我發長歎宿命有信然弱喪謂之無皆欲眼前見過目則言悠大賢明道教慘戚憫頑夫依依念子苦勤動令我憂人命以銷盡亦猶膏中火四大暫相遇五物權時假盛年當勤學趨求存吾我福盡身神散冥冥地獄下上聖畏是故尋道度斯禍學仙行為急奉戒制情心虛夷正氣居仙聖自相尋若不信法言胡不棲山林大賢樂經戒受之為身寶就學恆苦治身恨不早比當披幽賾倐忽年已老執卷歎爾極將更死痛惱吾故及弱齡棄世以學道出智惠本願大戒經官觀祝聖儀堂獻供文獻粥晨朝香粥滌去凡塵當令受者念道思真向來晨粥功德無限勝因恭為祝延皇帝聖夀無疆龍圖鞏固為上因緣念大聖和元始天尊太上和大道君太上和老君無量和不可思議功德登齋舉唱三寶八各恭敬志心稽首太上無極大道志心稽首三十六部尊經志心稽首玄中大法師平坐如法獻供文香厨妙供上獻天尊中獻真聖下及一切先生普同供飬齋畢念福生無量天尊和福生無量天尊福生無量天尊福生無量天尊福生無量天尊施出生呪勤修大道法精心感太冥真降魔魅散衆妖皆滅形七祖生天堂兆臣飛上清福既無不遍此食施衆生舉解坐讃次念向來修齋功德無限勝因恭為祝延皇帝聖夀無疆龍圖鞏固為上因緣念云云施主設齋舉唱三寶同前甗供文一切福田施食為先見存快樂已往生天當來淨土衣食自然是故供飬普獻諸天香厨妙供上獻天尊中獻真聖下及一切群生普同供養福流齋主如水歸海齋畢舉天尊號同前施出生呪解坐説不可思議功德海浩浩無邊太上尊肹饗尋聲赴道場鑒此修齋無量善向來設齋功德無限勝因回福祝延今辰齋主某身躬康泰祿位增崇凡歷時中吉祥如意伏願齋功紀籍道果資身齊龜鶴之修齡介厖鴻之景福為上因緣念度人無量天尊不可思議功德送聖頌回軿五雲輿騰駕九霄歌倐忽沖天遠醮壇香氣多玄恩覃宇宙福祿遍山河緬想神仙路逍遙上大羅披戴頌雲履飛鳬步雲舄登躡九玄壇舉意遊三界乘風五漢間願今一履迹騰踏謁金顔星冠𡺌爛七星冠飄颻降自天受之有科簡宿命應神仙願今一頂戴永保大椿年道裙六幅華裙異天人副羽衣飛裙凌寶殿緩帶步金墀願今一繫佩縹眇赴瑶池雲袖蒨璨素雲袖上下統裙裳織自扶桑繭猶聞月殿香願今一被體遊宴玉瓊房羽服上界神仙服天實自然裳輕盈六銖妙佩服應三光願今一披奉逍遙不死鄉拜壇三級依瑶砌八卦列方隅隔穢敷裙帔除塵護法裾願今一升躡朝修上帝居朝簡西臺無疵玉磨琢侍三皇正體除邪慮持心啓上蒼願今一秉執瑶階禮虛皇玉音法事卷下終
