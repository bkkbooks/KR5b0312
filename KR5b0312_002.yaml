front:
  text: 玉音法事卷中養二
  hash: sha256:0318c20f7651695352a0b0053af5e83add8e4a3c13bb88695c81c3bfe88b2755
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5b0312_HFL_002-001a, image: hfl/0333/0333-046.png}
body:
  text: 玉清樂引玉清樂上清樂引上清樂太清樂引太清樂散花引散字下小注殷字係鳥間功五言散花七言散花起敬讃三歸依志心皈依十方經寶當願衆生亡靈心開悟解受持轉誦志心皈依十方師寶當願衆生亡靈普上法橋無有障礙敷坐讃開經宿命讃三聞經聞經已後唯願衆生亡靈萬罪並消善芽增長聞經已後唯願衆生亡靈永斷執迷常歸正道解坐讃為諸來生作善因緣如蒙開悟仰荷玄恩每遇齋畢道唱道讃按藏經醮儀卷所載每遇唱道時知磬舉至末句道衆默念天尊三聲或五或七或九聲如陽醮念長生保命天尊福生無量天尊隂醮念太一救苦天尊華夏讃又曰四聲華夏按玉篇華字注華夏三千五百里為華夏言其迢遠之意今華夏用思真堂舉起徐徐吟詠過廊廡登殿壇而畢似取其迢逺之意也轉聲華夏讃請五師再舉雲輿頌送五師再舉修齋已畢仰荷玄恩志心稽首奉送玄師天師經籍度師雲輿頌雲輿不住鶴駕難留後有修齋還當奉請請符使三界直符四直功曹上奏靈官神將吏兵土地正神步虛詞三塗頌斗經末句禮十方禮十一曜舉信禮聲範十三號同關燈舉斗位三捻上香易名三上香初混元混元三境華蕊二捻上香香至洞天宫遍洞夭仙府成賈盍供養三淵泉淵泉水府雲混元三境尊洞天仙府君淵泉水府君玉音法事卷中
  hash: sha256:812bf0ae0461b4e6e537d1fa7af258c103bf5b54365084795a43595b7cc182c1
